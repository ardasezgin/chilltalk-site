# Keeps the ChillTalk Supabase project awake: the free tier pauses a project after
# 7 days without traffic. Calls a harmless keepalive() function every 2 days.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
